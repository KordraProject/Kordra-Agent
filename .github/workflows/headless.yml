name: Agent headless binaries / releases
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: windows-2022
            triple: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.triple }} -p kordra-agent
      - name: Package executable
        shell: bash
        env:
          TARGET: ${{ matrix.triple }}
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          triple = os.environ["TARGET"]
          suffix = ".exe" if "windows" in triple else ""
          filename = "kordra-agent" + suffix
          Path("packages").mkdir(exist_ok=True)
          with zipfile.ZipFile(Path("packages") / f"kordra-agent-{triple}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              archive.write(Path("target") / triple / "release" / filename, filename)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kordra-agent-${{ matrix.triple }}
          path: packages/*.zip
  release:
    needs: binary
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kordra-agent-*
          path: assets
          merge-multiple: true
      - name: Generate SHA-256 manifest and verify expected platforms
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          assets = Path("assets")
          triples = ("x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu")
          required = [assets / f"kordra-agent-{triple}.zip" for triple in triples]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f"Refusing incomplete release; missing: {missing}")
          (assets / "SHA256SUMS.txt").write_text("".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(required)
          ))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.0-dev.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Kordra-Agent pre-alpha ${{ github.run_number }}
          files: assets/*
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
